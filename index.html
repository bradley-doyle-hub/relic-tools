<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relic Tools</title>
<meta name="description" content="Small tools for the Relic Piercing & Tattoo team.">
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0e0e0e;color:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
  main{max-width:640px;margin:0 auto;padding:12vh 24px 64px}
  .eyebrow{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#c9c3b2}
  h1{margin:16px 0 12px;font-weight:300;font-size:clamp(36px,8vw,56px);line-height:1;letter-spacing:-.03em}
  p{margin:0 0 40px;color:#e8e3d6}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid rgba(244,241,234,.18)}
  li a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid rgba(244,241,234,.18);color:inherit;text-decoration:none}
  li a:hover .name{color:#4fb8cc}
  .name{font-size:20px}
  .note{display:block;margin-top:2px;font-size:14px;color:#c9c3b2}
  .arrow{color:#4fb8cc}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Relic Piercing &amp; Tattoo</span>
  <h1>Relic tools</h1>
  <p>Small tools for the team.</p>
  <ul>
    <li><a href="/signature/"><span><span class="name">Email signature</span><span class="note">Pick a name, copy, paste into your mail settings.</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
  </ul>
</main>
</body>
</html>
